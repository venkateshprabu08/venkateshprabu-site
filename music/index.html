<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music demo · Venkatesh Prabu</title>
  <meta name="description" content="Live demo of my self-hosted Navidrome music server.">
  <style>
    :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #666; --accent: #0f6e56; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eaeaea; --bg: #111; --muted: #aaa; --accent: #5dcaa5; } }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    main { max-width: 520px; text-align: left; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
    p { line-height: 1.6; color: var(--muted); margin: 0 0 16px; }
    a.button { display: inline-block; padding: 12px 20px; border-radius: 8px; background: var(--accent);
               color: #fff; text-decoration: none; font-weight: 500; }
    small { display: block; margin-top: 20px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Music streaming demo</h1>
    <p>A self-hosted music server I run at home, built with Navidrome. The demo library uses only licence-free and public-domain tracks.</p>
    <a class="button" href="https://linus.tail16ef75.ts.net/">Open the demo</a>
    <small>Log in with the demo account shown on the project page.</small>
  </main>
</body>
</html>
